[project]
name = "index-echo-s2st-service"
version = "0.1.0"
description = "Unitale Index-Echo GGUF speech translation API"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "unitale-runtime",
]

[tool.uv]
package = false

[tool.uv.sources]
unitale-runtime = { path = "../unitale_runtime", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

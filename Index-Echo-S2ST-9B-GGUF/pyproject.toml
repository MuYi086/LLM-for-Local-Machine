[project]
name = "index-echo-s2st-service"
version = "0.1.0"
description = "Unitale Index-Echo-S2ST native speech translation API"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "unitale-runtime",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
native = [
    "torch==2.11.0", "torchaudio==2.11.0", "transformers==5.6.0",
    "tokenizers==0.22.2", "librosa==1.0.0", "onnxruntime==1.30.0",
    "wetext==0.0.4", "kaldifst==1.8.0", "conformer==0.3.2",
    "hydra-core==1.3.7", "HyperPyYAML==1.2.3", "lightning==2.6.6",
    "x-transformers==2.11.24", "einx==0.4.3", "frozendict==2.4.7",
    "pyworld==0.3.5", "soundfile==0.13.1", "modelscope==1.37.1",
    "safetensors==0.7.0", "numpy==2.4.6", "openai-whisper==20250625",
]

[tool.uv]
package = false

[tool.uv.sources]
unitale-runtime = { path = "../unitale_runtime", editable = true }
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[project]
name = "yue2-vae-service"
version = "0.1.0"
description = "Unitale YuE2-Vae latent encoder and audio decoder HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.136.1",
    "huggingface-hub==0.36.2",
    "numpy==2.2.6",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "safetensors==0.7.0",
    "soundfile==0.13.1",
    "torch==2.10.0+cu128",
    "transformers==4.57.6",
    "unitale-runtime",
    "unitale-inference-gateway",
    "uvicorn==0.46.0",
]

[tool.uv]
package = false
index-strategy = "first-index"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["ruff>=0.15.9"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu128/"
format = "flat"
explicit = true

[tool.uv.sources]
unitale-runtime = { path = "../unitale_runtime", editable = true }
unitale-inference-gateway = { path = "../inference_gateway", editable = true }
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

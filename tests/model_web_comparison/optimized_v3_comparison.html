    spentAmount.textContent = &quot;¥&quot; + spent;

        card.appendChild(timeCol);

      })(trips[i]);

                    ${trip.completed ? 'checked' : ''} 
                    onchange=&quot;toggleTrip(${trip.id})&quot; 
                    aria-label=&quot;标记 ${trip.place} 完成&quot;&gt;
                &lt;div class=&quot;trip-content&quot;&gt;
                    &lt;h3&gt;${trip.place}&lt;/h3&gt;
                    &lt;div class=&quot;trip-meta&quot;&gt;
                        &lt;span&gt;🕒 ${trip.time}&lt;/span&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;trip-desc&quot;&gt;${trip.desc}&lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&quot;trip-cost&quot;&gt;¥${trip.cost}&lt;/div&gt;
                &lt;button class=&quot;btn-delete&quot; onclick=&quot;deleteTrip(${trip.id})&quot; aria-label=&quot;删除行程&quot; title=&quot;删除&quot;&gt;✕&lt;/button&gt;
            `;
            tripListEl.appendChild(li);
        });
        updateBudgetUI();
    }

    window.toggleTrip = function(id) {
        const trip = trips.find(t =&gt; t.id === id);
        if (trip) {
            trip.completed = !trip.completed;
            renderTrips();
        }
    };

    window.deleteTrip = function(id) {
        if(confirm('确定要删除这个行程吗？')) {
            trips = trips.filter(t =&gt; t.id !== id);
            renderTrips();
        }
    };

    window.resetTrips = function() {
        if(confirm('确定要重置为默认行程吗？当前修改将丢失。')) {
            trips = JSON.parse(JSON.stringify(defaultTrips));
            renderTrips();
        }
    };

    addTripForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const time = document.getElementById('newTime').value;
        const place = document.getElementById('newPlace').value;
        const cost = parseFloat(document.getElementById('newCost').value);

        if (time &amp;&amp; place &amp;&amp; !isNaN(cost)) {
            const newTrip = {
                id: Date.now(), // 简单ID生成
                time: time,
                place: place,
                desc: '自定义行程',
                cost: cost,
                completed: false
            };
            trips.push(newTrip);
            renderTrips();
            addTripForm.reset();
        }
    });

    // --- 行李清单逻辑 ---
    function renderPacking() {
        packingListEl.innerHTML = '';
        let checkedCount = 0;
        
        packing.forEach(item =&gt; {
            if (item.checked) checkedCount++;
            
            const label = document.createElement('label');
            label.className = `packing-item ${item.checked ? 'checked' : ''}`;
            label.innerHTML = `
                &lt;input type=&quot;checkbox&quot; onchange=&quot;togglePacking(${item.id})&quot;&gt;
                &lt;span&gt;${item.name}&lt;/span&gt;
            `;
            // 让点击整个标签也能触发checkbox
            label.addEventListener('click', function(e) {
                if (e.target.tagName !== 'INPUT') {
                    const checkbox = this.querySelector('input');
                    checkbox.checked = !checkbox.checked;
                    togglePacking(item.id);
                }
            });
            
            packingListEl.appendChild(label);
        });

        // 更新状态文字
        if (checkedCount === packing.length) {
            packingStatusEl.textContent = '✅ 准备就绪！';
            packingStatusEl.style.color = 'var(--success-color)';
        } else {
            packingStatusEl.textContent = `已准备 ${checkedCount}/${packing.length}`;
            packingStatusEl.style.color = 'var(--text-secondary)';
        }
    }

    window.togglePacking = function(id) {
        const item = packing.find(p =&gt; p.id === id);
        if (item) {
            item.checked = !item.checked;
            renderPacking();
        }
    };

    // 启动应用
    init();

&lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;"></iframe></section></main>
</body>
</html>

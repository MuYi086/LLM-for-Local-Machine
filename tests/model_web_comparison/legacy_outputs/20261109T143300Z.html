<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周末城市微旅行规划器</title>
<style>
  :root {
    --primary: #2e86ab;
    --primary-dark: #21618c;
    --accent: #f6a623;
    --bg: #f4f7f9;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --text-light: #6b7d8d;
    --border: #e1e8ed;
    --success: #27ae60;
    --danger: #e74c3c;
    --radius: 14px;
    --shadow: 0 4px 16px rgba(44, 62, 80, 0.08);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  a:focus,
  button:focus,
  input:focus,
  [tabindex]:focus {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    padding: 40px 20px 48px;
    text-align: center;
  }

  header h1 {
    font-size: 2rem;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }

  header p {
    font-size: 1rem;
    opacity: 0.92;
    max-width: 520px;
    margin: 0 auto 20px;
  }

  .date-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 10px 26px;
    border-radius: 50px;
    box-shadow: 0 4px 14px rgba(246, 166, 35, 0.45);
    letter-spacing: 1px;
  }

  /* Section */
  section {
    margin-top: 32px;
  }

  .section-title {
    font-size: 1.3rem;
    margin-bottom: 16px;
    padding-left: 12px;
    border-left: 5px solid var(--primary);
    color: var(--text);
  }

  /* Budget Card */
  .budget-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
  }

  .budget-form {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .input-group label {
    font-size: 0.85rem;
    color: var(--text-light);
    font-weight: 600;
  }

  .input-group input {
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 1rem;
    width: 200px;
    transition: border-color 0.2s;
  }

  .input-group input:focus {
    border-color: var(--primary);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    border-radius: 10px;
    padding: 11px 22px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
    color: #fff;
  }

  .btn:active {
    transform: scale(0.96);
  }

  .btn-primary {
    background: var(--primary);
  }

  .btn-primary:hover {
    background: var(--primary-dark);
  }

  .btn-accent {
    background: var(--accent);
  }

  .btn-accent:hover {
    background: #e09510;
  }

  .btn-danger {
    background: var(--danger);
    padding: 7px 14px;
    font-size: 0.85rem;
  }

  .btn-danger:hover {
    background: #c0392b;
  }

  .btn-outline {
    background: transparent;
    border: 2px dashed var(--primary);
    color: var(--primary);
  }

  .btn-outline:hover {
    background: var(--primary);
    color: #fff;
  }

  .btn-add {
    width: 100%;
    justify-content: center;
    margin-top: 14px;
  }

  /* Budget Progress */
  .budget-summary {
    margin-top: 24px;
  }

  .budget-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    margin-bottom: 14px;
  }

  .stat {
    flex: 1;
    min-width: 140px;
    text-align: center;
    padding: 14px;
    border-radius: 10px;
    background: var(--bg);
  }

  .stat .label {
    font-size: 0.8rem;
    color: var(--text-light);
    display: block;
    margin-bottom: 4px;
  }

  .stat .value {
    font-size: 1.4rem;
    font-weight: 700;
  }

  .stat-spent .value { color: var(--primary); }
  .stat-remaining .value { color: var(--success); }
  .stat-over .value { color: var(--danger); }

  .progress-track {
    width: 100%;
    height: 22px;
    background: #e8eef2;
    border-radius: 50px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    border-radius: 50px;
    transition: width 0.4s ease;
    min-width: 0;
  }

  .progress-fill.over {
    background: linear-gradient(90deg, var(--danger), #f39c12);
  }

  .progress-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }

  /* Itinerary */
  .itinerary-list {
    display: grid;
    gap: 16px;
  }

  .trip-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    transition: opacity 0.3s, transform 0.2s;
    position: relative;
  }

  .trip-card.done {
    opacity: 0.6;
  }

  .trip-card .time-col {
    background: var(--primary);
    color: #fff;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 96px;
    text-align: center;
  }

  .trip-card .time-col .time {
    font-size: 1.1rem;
    font-weight: 700;
  }

  .trip-card .time-col .period {
    font-size: 0.75rem;
    opacity: 0.85;
    margin-top: 4px;
  }

  .trip-card .body {
    flex: 1;
    padding: 16px 20px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .trip-checkbox {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    margin-top: 2px;
    accent-color: var(--success);
    cursor: pointer;
  }

  .trip-info {
    flex: 1;
  }

  .trip-info h3 {
    font-size: 1.05rem;
    margin-bottom: 4px;
  }

  .trip-info .place {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 6px;
  }

  .trip-info .desc {
    font-size: 0.9rem;
    color: var(--text);
  }

  .trip-cost {
    flex-shrink: 0;
    text-align: right;
    font-weight: 700;
    color: var(--accent);
    font-size: 1.05rem;
    align-self: center;
    white-space: nowrap;
  }

  .trip-card .delete-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: transparent;
    border: none;
    color: #c0cdd6;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s;
    line-height: 1;
  }

  .trip-card .delete-btn:hover {
    color: var(--danger);
    background: rgba(231, 76, 60, 0.1);
  }

  .trip-card.done .trip-info h3 {
    text-decoration: line-through;
    text-decoration-color: var(--text-light);
  }

  .empty-note {
    text-align: center;
    color: var(--text-light);
    padding: 30px;
    font-size: 0.95rem;
  }

  /* Packing */
  .packing-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
  }

  .packing-progress {
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .packing-progress .track {
    flex: 1;
    height: 12px;
    background: #e8eef2;
    border-radius: 50px;
    overflow: hidden;
  }

  .packing-progress .fill {
    height: 100%;
    background: var(--success);
    border-radius: 50px;
    transition: width 0.3s ease;
  }

  .packing-progress .pct {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-light);
    white-space: nowrap;
  }

  .packing-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }

  .packing-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    user-select: none;
  }

  .packing-item:hover {
    border-color: var(--primary);
  }

  .packing-item input {
    width: 20px;
    height: 20px;
    accent-color: var(--success);
    cursor: pointer;
    flex-shrink: 0;
  }

  .packing-item .icon {
    font-size: 1.3rem;
    flex-shrink: 0;
  }

  .packing-item .name {
    font-size: 0.95rem;
  }

  .packing-item.checked {
    background: #eaf7ef;
    border-color: var(--success);
  }

  .packing-item.checked .name {
    color: var(--text-light);
    text-decoration: line-through;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-light);
    font-size: 0.85rem;
  }

  /* Responsive */
  @media (max-width: 600px) {
    header {
      padding: 30px 16px 40px;
    }
    header h1 {
      font-size: 1.5rem;
    }
    .trip-card {
      flex-direction: column;
    }
    .trip-card .time-col {
      flex-direction: row;
      gap: 8px;
      min-width: 0;
      padding: 10px 14px;
    }
    .trip-card .time-col .period {
      display: none;
    }
    .trip-card .body {
      flex-direction: column;
      gap: 8px;
    }
    .trip-cost {
      align-self: flex-start;
    }
    .trip-card .delete-btn {
      top: 6px;
      right: 6px;
    }
    .budget-form {
      flex-direction: column;
      align-items: stretch;
    }
    .input-group input {
      width: 100%;
    }
    .stat {
      min-width: 100px;
    }
  }
</style>
</head>
<body>
  <header>
    <div class="container" style="padding-top:0;padding-bottom:0;">
      <h1>🌆 周末城市微旅行规划器</h1>
      <p>为轻松的周末短途旅行，规划目的地、行程、预算与行李。勾选已完成的项目，享受一段惬意的城市微旅行。</p>
      <div class="date-badge" id="dateBadge">本周末加载中…</div>
    </div>
  </header>

  <main class="container">

    <!-- 预算 -->
    <section aria-labelledby="budget-title">
      <h2 class="section-title" id="budget-title">💰 预算规划</h2>
      <div class="budget-card">
        <div class="budget-form">
          <div class="input-group">
            <label for="destination">目的地</label>
            <input type="text" id="destination" value="苏州古城" placeholder="请输入目的地">
          </div>
          <div class="input-group">
            <label for="budget">人均预算（元）</label>
            <input type="number" id="budget" min="0" step="50" value="500">
          </div>
          <button class="btn btn-primary" id="budgetBtn" type="button">更新预算</button>
        </div>
        <div class="budget-summary">
          <div class="budget-stats">
            <div class="stat stat-spent">
              <span class="label">已规划支出</span>
              <span class="value" id="spentAmount">¥0</span>
            </div>
            <div class="stat stat-remaining">
              <span class="label">剩余预算</span>
              <span class="value" id="remainingAmount">¥0</span>
            </div>
            <div class="stat stat-over">
              <span class="label">目的地</span>
              <span class="value" id="destStat" style="font-size:1.1rem;">—</span>
            </div>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
            <span class="progress-text" id="progressText">已使用 0%</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 行程 -->
    <section aria-labelledby="itinerary-title">
      <h2 class="section-title" id="itinerary-title">🗺️ 周末行程</h2>
      <div class="itinerary-list" id="itineraryList"></div>
      <button class="btn btn-outline btn-add" id="addTripBtn" type="button">＋ 添加新行程</button>
    </section>

    <!-- 行李 -->
    <section aria-labelledby="packing-title">
      <h2 class="section-title" id="packing-title">🎒 行李清单</h2>
      <div class="packing-card">
        <div class="packing-progress">
          <span class="pct" id="packingPct">0 / 0</span>
          <div class="track">
            <div class="fill" id="packingFill" style="width:0%"></div>
          </div>
        </div>
        <div class="packing-grid" id="packingGrid"></div>
      </div>
    </section>

  </main>

  <footer>
    <p>周末城市微旅行规划器 · 祝你旅途愉快 🚂</p>
  </footer>

<script>
(function () {
  "use strict";

  /* ---------- 计算本周末日期 ---------- */
  function getWeekendRange() {
    var now = new Date();
    var day = now.getDay(); // 0=周日, 6=周六
    var saturday = new Date(now);
    saturday.setDate(now.getDate() + ((6 - day + 7) % 7));
    var sunday = new Date(saturday);
    sunday.setDate(saturday.getDate() + 1);
    function fmt(d) {
      return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
    }
    return { start: fmt(saturday), end: fmt(sunday), saturday: saturday };
  }

  var weekend = getWeekendRange();
  document.getElementById("dateBadge").textContent =
    "本周末：" + weekend.start + " 至 " + weekend.end;

  /* ---------- 行程数据 ---------- */
  var trips = [
    {
      time: "08:30",
      place: "高铁站 · 出发",
      title: "乘坐高铁前往目的地",
      desc: "提前到达车站，享用早餐，欣赏沿途风景，轻松抵达。",
      cost: 160,
      done: false
    },
    {
      time: "10:30",
      place: "古城老街",
      title: "漫步老街 · 品尝地道小吃",
      desc: "逛青石板老街，尝当地特色早点与甜点，感受慢节奏生活。",
      cost: 60,
      done: false
    },
    {
      time: "12:30",
      place: "湖畔餐厅",
      title: "午餐 · 湖景休憩",
      desc: "在湖景餐厅享用当地特色午餐，稍作休息，放松身心。",
      cost: 80,
      done: false
    },
    {
      time: "14:30",
      place: "城市公园 / 博物馆",
      title: "游览公园或参观博物馆",
      desc: "午后游览城市公园，或参观本地博物馆，感受人文气息。",
      cost: 40,
      done: false
    },
    {
      time: "17:30",
      place: "特色咖啡馆",
      title: "下午茶 · 拍照留念",
      desc: "找一家有格调的咖啡馆，喝杯下午茶，整理照片与心情。",
      cost: 50,
      done: false
    },
    {
      time: "19:00",
      place: "高铁站 · 返程",
      title: "晚餐后返程",
      desc: "在车站附近享用晚餐，乘坐高铁返回，结束愉快的周末之旅。",
      cost: 160,
      done: false
    }
  ];

  /* ---------- 行李数据 ---------- */
  var packing = [
    { name: "相机", icon: "📷", checked: false },
    { name: "充电器", icon: "🔌", checked: false },
    { name: "雨伞", icon: "☂️", checked: false },
    { name: "换洗衣物", icon: "👕", checked: false },
    { name: "洗漱用品", icon: "🪥", checked: false },
    { name: "充电宝", icon: "🔋", checked: false },
    { name: "身份证", icon: "🪪", checked: false },
    { name: "舒适步行鞋", icon: "👟", checked: false }
  ];

  /* ---------- 预算相关 ---------- */
  var budgetInput = document.getElementById("budget");
  var destinationInput = document.getElementById("destination");
  var spentAmount = document.getElementById("spentAmount");
  var remainingAmount = document.getElementById("remainingAmount");
  var destStat = document.getElementById("destStat");
  var progressFill = document.getElementById("progressFill");
  var progressText = document.getElementById("progressText");

  function getBudget() {
    var v = parseInt(budgetInput.value, 10);
    return isNaN(v) || v < 0 ? 0 : v;
  }

  function getSpent() {
    var total = 0;
    for (var i = 0; i < trips.length; i++) {
      total += trips[i].cost;
    }
    return total;
  }

  function updateBudget() {
    var budget = getBudget();
    var spent = getSpent();
    var remaining = budget - spent;
    var pct = budget > 0 ? Math.round((spent / budget) * 100) : 0;

    spentAmount.textContent = "¥" + spent;
    destStat.textContent = destinationInput.value || "—";

    if (remaining >= 0) {
      remainingAmount.textContent = "¥" + remaining;
      remainingAmount.parentElement.className = "stat stat-remaining";
    } else {
      remainingAmount.textContent = "-¥" + Math.abs(remaining);
      remainingAmount.parentElement.className = "stat stat-over";
    }

    var clamped = Math.min(pct, 100);
    progressFill.style.width = clamped + "%";
    progressFill.className = "progress-fill" + (pct > 100 ? " over" : "");
    progressText.textContent = "已使用 " + pct + "%";
  }

  budgetInput.addEventListener("input", updateBudget);
  destinationInput.addEventListener("input", updateBudget);
  document.getElementById("budgetBtn").addEventListener("click", function () {
    updateBudget();
  });

  /* ---------- 行程渲染 ---------- */
  var itineraryList = document.getElementById("itineraryList");

  function renderTrips() {
    itineraryList.innerHTML = "";
    if (trips.length === 0) {
      var note = document.createElement("p");
      note.className = "empty-note";
      note.textContent = "暂无行程，点击下方按钮添加你的第一个行程吧！";
      itineraryList.appendChild(note);
      updateBudget();
      return;
    }
    for (var i = 0; i < trips.length; i++) {
      (function (trip) {
        var card = document.createElement("article");
        card.className = "trip-card" + (trip.done ? " done" : "");

        var timeCol = document.createElement("div");
        timeCol.className = "time-col";
        timeCol.innerHTML =
          '<span class="time">' + trip.time + '</span>' +
          '<span class="period">行程</span>';

        var body = document.createElement("div");
        body.className = "body";

        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "trip-checkbox";
        checkbox.checked = trip.done;
        checkbox.setAttribute("aria-label", "标记「" + trip.title + "」为已完成");
        checkbox.addEventListener("change", function () {
          trip.done = checkbox.checked;
          renderTrips();
        });

        var info = document.createElement("div");
        info.className = "trip-info";
        info.innerHTML =
          '<h3>' + trip.title + '</h3>' +
          '<div class="place">📍 ' + trip.place + '</div>' +
          '<div class="desc">' + trip.desc + '</div>';

        var cost = document.createElement("div");
        cost.className = "trip-cost";
        cost.textContent = "¥" + trip.cost;

        body.appendChild(checkbox);
        body.appendChild(info);
        body.appendChild(cost);

        var delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "delete-btn";
        delBtn.textContent = "✕";
        delBtn.setAttribute("aria-label", "删除行程「" + trip.title + "」");
        delBtn.addEventListener("click", function () {
          trips.splice(i, 1);
          renderTrips();
        });

        card.appendChild(timeCol);
        card.appendChild(body);
        card.appendChild(delBtn);
        itineraryList.appendChild(card);
      })(trips[i]);
    }
    updateBudget();
  }

  document.getElementById("addTripBtn").addEventListener("click", function () {
    var newTrip = {
      time: "12:00",
      place: "待定地点",
      title: "新增行程",
      desc: "点击编辑，添加你的活动说明与费用。",
      cost: 0,
      done: false
    };
    trips.push(newTrip);
    renderTrips();
    window.scrollTo({ top: document.getElementById("itinerary-title").offsetTop - 20, behavior: "smooth" });
  });

  /* ---------- 行李渲染 ---------- */
  var packingGrid = document.getElementById("packingGrid");
  var packingPct = document.getElementById("packingPct");
  var packingFill = document.getElementById("packingFill");

  function renderPacking() {
    packingGrid.innerHTML = "";
    var total = packing.length;
    var checkedCount = 0;
    for (var i = 0; i < packing.length; i++) {
      (function (item) {
        if (item.checked) checkedCount++;
        var label = document.createElement("label");
        label.className = "packing-item" + (item.checked ? " checked" : "");

        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = item.checked;
        checkbox.setAttribute("aria-label", "勾选「" + item.name + "」");
        checkbox.addEventListener("change", function () {
          item.checked = checkbox.checked;
          renderPacking();
        });

        var icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = item.icon;

        var name = document.createElement("span");
        name.className = "name";
        name.textContent = item.name;

        label.appendChild(checkbox);
        label.appendChild(icon);
        label.appendChild(name);
        packingGrid.appendChild(label);
      })(packing[i]);
    }
    packingPct.textContent = checkedCount + " / " + total;
    packingFill.style.width = (total ? Math.round((checkedCount / total) * 100) : 0) + "%";
  }

  /* ---------- 初始化 ---------- */
  updateBudget();
  renderTrips();
  renderPacking();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周末城市微旅行规划器</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --primary: #2e86de;
    --primary-dark: #1e6fa8;
    --accent: #f39c12;
    --success: #27ae60;
    --danger: #e74c3c;
    --bg: #f4f7fa;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --text-light: #637a8f;
    --border: #dfe6ed;
    --shadow: 0 4px 16px rgba(44, 62, 80, 0.08);
    --radius: 14px;
  }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  a:focus,
  button:focus,
  input:focus,
  [tabindex]:focus {
    outline: 3px solid var(--primary);
    outline-offset: 2px;
    border-radius: 4px;
  }

  header {
    background: linear-gradient(135deg, var(--primary) 0%, #48a3e8 100%);
    color: #fff;
    padding: 36px 20px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::after {
    content: "";
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100%;
    height: 32px;
    background: var(--bg);
    clip-path: polygon(0 100%, 100% 100%, 100% 0);
  }

  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    margin-bottom: 8px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  header p {
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    opacity: 0.92;
    max-width: 560px;
    margin: 0 auto 18px;
  }

  .date-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: clamp(0.9rem, 2.5vw, 1.1rem);
    font-weight: 700;
    padding: 10px 24px;
    border-radius: 50px;
    box-shadow: 0 4px 14px rgba(243, 156, 18, 0.4);
    letter-spacing: 0.5px;
  }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 24px 18px 60px;
  }

  section {
    margin-bottom: 30px;
  }

  .section-title {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 14px;
    padding-left: 12px;
    border-left: 4px solid var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
  }

  /* 输入区 */
  .input-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .input-group {
    flex: 1;
    min-width: 200px;
  }

  .input-group label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .input-group input {
    width: 100%;
    padding: 11px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    color: var(--text);
    background: #fff;
    transition: border-color 0.2s;
  }

  .input-group input:focus {
    border-color: var(--primary);
  }

  /* 预算 */
  .budget-card {
    margin-top: 16px;
  }

  .budget-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    margin-bottom: 8px;
    color: var(--text-light);
  }

  .budget-info strong {
    color: var(--text);
  }

  .budget-remaining {
    font-weight: 700;
  }

  .progress-track {
    width: 100%;
    height: 22px;
    background: #e8eef3;
    border-radius: 50px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), #48a3e8);
    border-radius: 50px;
    transition: width 0.4s ease;
    min-width: 0;
  }

  .progress-fill.warn {
    background: linear-gradient(90deg, var(--accent), #f7b731);
  }

  .progress-fill.over {
    background: linear-gradient(90deg, var(--danger), #ff6b6b);
  }

  .budget-status {
    margin-top: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    min-height: 20px;
  }

  /* 行程卡片 */
  .itinerary-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .trip-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    display: flex;
    gap: 16px;
    position: relative;
    border-left: 5px solid var(--primary);
    transition: opacity 0.3s, transform 0.2s;
  }

  .trip-card.done {
    border-left-color: var(--success);
    opacity: 0.72;
  }

  .trip-card.done .trip-activity {
    text-decoration: line-through;
    color: var(--text-light);
  }

  .trip-check {
    flex-shrink: 0;
  }

  .trip-check input {
    width: 22px;
    height: 22px;
    cursor: pointer;
    accent-color: var(--success);
  }

  .trip-body {
    flex: 1;
  }

  .trip-time {
    display: inline-block;
    background: #eaf3fd;
    color: var(--primary-dark);
    font-size: 0.8rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 50px;
    margin-bottom: 6px;
  }

  .trip-place {
    font-weight: 700;
    font-size: 1.05rem;
    margin-bottom: 4px;
  }

  .trip-activity {
    color: var(--text-light);
    font-size: 0.92rem;
  }

  .trip-cost {
    margin-top: 8px;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent);
  }

  .trip-del {
    flex-shrink: 0;
    background: none;
    border: none;
    color: #c0392b;
    font-size: 1.4rem;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    line-height: 1;
    transition: background 0.2s;
  }

  .trip-del:hover {
    background: #fdecea;
  }

  .add-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .add-btn:hover {
    background: var(--primary-dark);
  }

  .add-btn:active {
    transform: scale(0.97);
  }

  /* 行李清单 */
  .packing-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }

  .packing-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: background 0.2s;
    user-select: none;
  }

  .packing-item:hover {
    background: #f0f7ff;
  }

  .packing-item input {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: var(--success);
    flex-shrink: 0;
  }

  .packing-item.checked {
    background: #eafaf1;
  }

  .packing-item.checked .packing-name {
    text-decoration: line-through;
    color: var(--text-light);
  }

  .packing-emoji {
    font-size: 1.3rem;
  }

  .packing-name {
    font-size: 0.95rem;
  }

  /* 弹窗 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(44, 62, 80, 0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.show {
    display: flex;
  }

  .modal {
    background: #fff;
    border-radius: var(--radius);
    padding: 26px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    animation: popIn 0.25s ease;
  }

  @keyframes popIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal h3 {
    margin-bottom: 18px;
    font-size: 1.15rem;
  }

  .modal-field {
    margin-bottom: 14px;
  }

  .modal-field label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 5px;
    font-weight: 600;
  }

  .modal-field input {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    color: var(--text);
  }

  .modal-field input:focus {
    border-color: var(--primary);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  .modal-actions button {
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }

  .btn-cancel {
    background: #e8eef3;
    color: var(--text-light);
  }

  .btn-confirm {
    background: var(--primary);
    color: #fff;
  }

  .btn-confirm:hover {
    background: var(--primary-dark);
  }

  footer {
    text-align: center;
    padding: 20px;
    color: var(--text-light);
    font-size: 0.82rem;
  }

  .empty-tip {
    text-align: center;
    color: var(--text-light);
    padding: 20px;
    font-size: 0.92rem;
  }

  @media (max-width: 520px) {
    .input-row {
      flex-direction: column;
    }
    .input-group {
      min-width: 100%;
    }
    .packing-list {
      grid-template-columns: 1fr 1fr;
    }
    .trip-del {
      position: absolute;
      top: 12px;
      right: 12px;
    }
  }
</style>
</head>
<body>
<header>
  <h1>🌆 周末城市微旅行规划器</h1>
  <p>为轻松的周末短途旅行量身打造，规划行程、控制预算、整理行李，说走就走。</p>
  <div class="date-badge" id="dateBadge">本周末加载中…</div>
</header>

<main>
  <!-- 输入区 -->
  <section aria-labelledby="input-title">
    <h2 class="section-title" id="input-title">📝 旅行设置</h2>
    <div class="card">
      <div class="input-row">
        <div class="input-group">
          <label for="destination">目的地</label>
          <input type="text" id="destination" value="邻近文艺小城" placeholder="请输入目的地">
        </div>
        <div class="input-group">
          <label for="budget">人均预算（元）</label>
          <input type="number" id="budget" value="500" min="0" step="50" placeholder="请输入人均预算">
        </div>
      </div>
      <div class="budget-card">
        <div class="budget-info">
          <span>已花费：<strong id="spentAmount">0</strong> 元</span>
          <span>剩余：<strong class="budget-remaining" id="remainingAmount">500</strong> 元</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div class="budget-status" id="budgetStatus"></div>
      </div>
    </div>
  </section>

  <!-- 行程 -->
  <section aria-labelledby="itinerary-title">
    <h2 class="section-title" id="itinerary-title">🗺️ 周末行程</h2>
    <div class="itinerary-list" id="itineraryList"></div>
    <button class="add-btn" id="addBtn">＋ 添加行程</button>
  </section>

  <!-- 行李 -->
  <section aria-labelledby="packing-title">
    <h2 class="section-title" id="packing-title">🎒 行李清单</h2>
    <div class="packing-list" id="packingList"></div>
  </section>
</main>

<footer>
  <p>周末微旅行规划器 · 祝你旅途愉快 🚂</p>
</footer>

<!-- 添加行程弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">添加新行程</h3>
    <div class="modal-field">
      <label for="f-time">时间</label>
      <input type="text" id="f-time" placeholder="例如：上午 9:00">
    </div>
    <div class="modal-field">
      <label for="f-place">地点</label>
      <input type="text" id="f-place" placeholder="例如：城市公园">
    </div>
    <div class="modal-field">
      <label for="f-activity">活动说明</label>
      <input type="text" id="f-activity" placeholder="例如：散步、拍照">
    </div>
    <div class="modal-field">
      <label for="f-cost">费用（元）</label>
      <input type="number" id="f-cost" min="0" step="1" placeholder="例如：30">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn" type="button">取消</button>
      <button class="btn-confirm" id="confirmBtn" type="button">添加</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- 计算本周末日期 ---------- */
  function getWeekendRange() {
    var now = new Date();
    var day = now.getDay(); // 0=周日, 6=周六
    var sat = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    sat.setDate(sat.getDate() + ((6 - day + 7) % 7));
    var sun = new Date(sat);
    sun.setDate(sun.getDate() + 1);
    function fmt(d) {
      return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
    }
    return { start: fmt(sat), end: fmt(sun), sat: sat, sun: sun };
  }

  var weekend = getWeekendRange();
  document.getElementById("dateBadge").textContent =
    "本周末 · " + weekend.start + " 至 " + weekend.end;

  /* ---------- 初始行程数据 ---------- */
  var itinerary = [
    {
      time: "上午 8:30",
      place: "城市火车站",
      activity: "乘坐城际列车抵达邻近文艺小城，感受清晨的慢节奏",
      cost: 120,
      done: false
    },
    {
      time: "上午 10:30",
      place: "老城历史街区",
      activity: "漫步青石小巷，参观独立书店与手作工坊",
      cost: 60,
      done: false
    },
    {
      time: "中午 12:30",
      place: "街角老字号餐馆",
      activity: "品尝当地特色午餐，尝一碗地道面食",
      cost: 50,
      done: false
    },
    {
      time: "下午 14:30",
      place: "滨江艺术画廊",
      activity: "欣赏当代艺术展，在江边咖啡馆小憩",
      cost: 40,
      done: false
    },
    {
      time: "傍晚 17:30",
      place: "山顶观景台",
      activity: "登高远眺城市全景，拍摄日落美景",
      cost: 30,
      done: false
    },
    {
      time: "晚上 19:00",
      place: "特色夜市",
      activity: "逛夜市小吃，采购手信，轻松返程",
      cost: 100,
      done: false
    }
  ];

  /* ---------- 初始行李清单 ---------- */
  var packing = [
    { name: "相机", emoji: "📷", checked: false },
    { name: "充电器", emoji: "🔌", checked: false },
    { name: "雨伞", emoji: "☂️", checked: false },
    { name: "换洗衣物", emoji: "👕", checked: false },
    { name: "洗漱用品", emoji: "🪥", checked: false },
    { name: "充电宝", emoji: "🔋", checked: false },
    { name: "遮阳帽", emoji: "🧢", checked: false },
    { name: "舒适步行鞋", emoji: "👟", checked: false }
  ];

  /* ---------- 渲染行程 ---------- */
  var itineraryList = document.getElementById("itineraryList");

  function renderItinerary() {
    itineraryList.innerHTML = "";
    if (itinerary.length === 0) {
      var tip = document.createElement("p");
      tip.className = "empty-tip";
      tip.textContent = "暂无行程，点击「添加行程」开始规划吧～";
      itineraryList.appendChild(tip);
      updateBudget();
      return;
    }
    itinerary.forEach(function (item, index) {
      var card = document.createElement("article");
      card.className = "trip-card" + (item.done ? " done" : "");

      var check = document.createElement("label");
      check.className = "trip-check";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = item.done;
      cb.setAttribute("aria-label", "标记「" + item.place + "」为已完成");
      cb.addEventListener("change", function () {
        item.done = cb.checked;
        renderItinerary();
      });
      check.appendChild(cb);
      card.appendChild(check);

      var body = document.createElement("div");
      body.className = "trip-body";

      var time = document.createElement("span");
      time.className = "trip-time";
      time.textContent = item.time;
      body.appendChild(time);

      var place = document.createElement("div");
      place.className = "trip-place";
      place.textContent = item.place;
      body.appendChild(place);

      var act = document.createElement("div");
      act.className = "trip-activity";
      act.textContent = item.activity;
      body.appendChild(act);

      var cost = document.createElement("div");
      cost.className = "trip-cost";
      cost.textContent = "费用：" + item.cost + " 元";
      body.appendChild(cost);

      card.appendChild(body);

      var del = document.createElement("button");
      del.className = "trip-del";
      del.type = "button";
      del.textContent = "✕";
      del.setAttribute("aria-label", "删除「" + item.place + "」行程");
      del.title = "删除此行程";
      del.addEventListener("click", function () {
        if (confirm("确定要删除这个行程吗？")) {
          itinerary.splice(index, 1);
          renderItinerary();
        }
      });
      card.appendChild(del);

      itineraryList.appendChild(card);
    });
    updateBudget();
  }

  /* ---------- 渲染行李清单 ---------- */
  var packingList = document.getElementById("packingList");

  function renderPacking() {
    packingList.innerHTML = "";
    packing.forEach(function (item, index) {
      var el = document.createElement("label");
      el.className = "packing-item" + (item.checked ? " checked" : "");

      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = item.checked;
      cb.setAttribute("aria-label", "勾选「" + item.name + "」");
      cb.addEventListener("change", function () {
        item.checked = cb.checked;
        el.classList.toggle("checked", item.checked);
      });
      el.appendChild(cb);

      var emoji = document.createElement("span");
      emoji.className = "packing-emoji";
      emoji.textContent = item.emoji;
      el.appendChild(emoji);

      var name = document.createElement("span");
      name.className = "packing-name";
      name.textContent = item.name;
      el.appendChild(name);

      packingList.appendChild(el);
    });
  }

  /* ---------- 预算计算 ---------- */
  var budgetInput = document.getElementById("budget");
  var spentAmount = document.getElementById("spentAmount");
  var remainingAmount = document.getElementById("remainingAmount");
  var progressFill = document.getElementById("progressFill");
  var budgetStatus = document.getElementById("budgetStatus");

  function updateBudget() {
    var budget = parseFloat(budgetInput.value);
    if (isNaN(budget) || budget < 0) budget = 0;

    var spent = 0;
    itinerary.forEach(function (item) {
      if (item.done) {
        spent += item.cost || 0;
      }
    });

    var remaining = budget - spent;
    var pct = budget > 0 ? Math.min((spent / budget) * 100, 100) : 0;

    spentAmount.textContent = spent;
    remainingAmount.textContent = remaining;
    progressFill.style.width = pct + "%";

    progressFill.classList.remove("warn", "over");
    if (remaining < 0) {
      progressFill.classList.add("over");
      budgetStatus.style.color = "#e74c3c";
      budgetStatus.textContent = "⚠ 预算已超支 " + Math.abs(remaining) + " 元，请调整行程～";
    } else if (pct >= 80) {
      progressFill.classList.add("warn");
      budgetStatus.style.color = "#f39c12";
      budgetStatus.textContent = "⚡ 预算使用已接近上限，注意控制花费";
    } else {
      budgetStatus.style.color = "#27ae60";
      budgetStatus.textContent = "✅ 预算充足，可以安心享受旅程";
    }
  }

  budgetInput.addEventListener("input", updateBudget);

  /* ---------- 添加行程弹窗 ---------- */
  var overlay = document.getElementById("modalOverlay");
  var addBtn = document.getElementById("addBtn");
  var cancelBtn = document.getElementById("cancelBtn");
  var confirmBtn = document.getElementById("confirmBtn");
  var fTime = document.getElementById("f-time");
  var fPlace = document.getElementById("f-place");
  var fActivity = document.getElementById("f-activity");
  var fCost = document.getElementById("f-cost");

  function openModal() {
    overlay.classList.add("show");
    fTime.value = "";
    fPlace.value = "";
    fActivity.value = "";
    fCost.value = "";
    setTimeout(function () { fPlace.focus(); }, 100);
  }

  function closeModal() {
    overlay.classList.remove("show");
    addBtn.focus();
  }

  addBtn.addEventListener("click", openModal);
  cancelBtn.addEventListener("click", closeModal);
  confirmBtn.addEventListener("click", function () {
    var place = fPlace.value.trim();
    if (!place) {
      alert("请填写地点后再添加～");
      fPlace.focus();
      return;
    }
    var costVal = parseFloat(fCost.value);
    itinerary.push({
      time: fTime.value.trim() || "待定时间",
      place: place,
      activity: fActivity.value.trim() || "暂无说明",
      cost: isNaN(costVal) ? 0 : costVal,
      done: false
    });
    renderItinerary();
    closeModal();
  });

  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) closeModal();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && overlay.classList.contains("show")) {
      closeModal();
    }
  });

  /* ---------- 初始化 ---------- */
  renderItinerary();
  renderPacking();
  updateBudget();
})();
</script>
</body>
</html>

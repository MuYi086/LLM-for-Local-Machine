<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周末城市微旅行规划器</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-secondary: #666666;
            --border-color: #e1e4e8;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        /* 布局容器 */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 头部样式 */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .date-badge {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 4px rgba(74, 144, 226, 0.3);
        }

        /* 卡片通用样式 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 表单元素 */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        /* 预算进度条 */
        .budget-summary {
            margin-top: 15px;
        }

        .progress-bar-bg {
            height: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--success-color);
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .budget-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .budget-text span.over-budget {
            color: var(--danger-color);
            font-weight: bold;
        }

        /* 行程列表 */
        .itinerary-list {
            list-style: none;
        }

        .itinerary-item {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 12px;
            transition: all 0.2s;
            background-color: #fff;
        }

        .itinerary-item.completed {
            background-color: #f8f9fa;
            border-color: #e9ecef;
        }

        .itinerary-item.completed .item-content h3 {
            text-decoration: line-through;
            color: #999;
        }

        .item-checkbox {
            margin-top: 4px;
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .item-content {
            flex: 1;
        }

        .item-time {
            font-size: 0.85rem;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .item-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .item-cost {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            padding: 5px;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: var(--danger-color);
        }

        /* 添加行程表单 */
        .add-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
        }

        .add-form input {
            padding: 8px;
            font-size: 0.9rem;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            grid-column: span 2;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* 行李清单 */
        .packing-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .packing-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        .packing-item:hover {
            background-color: #e9ecef;
        }

        .packing-item.checked {
            background-color: #e8f5e9;
            color: var(--success-color);
        }

        .packing-item input {
            margin-right: 10px;
            accent-color: var(--success-color);
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .add-form {
                grid-template-columns: 1fr;
            }
            
            .btn-primary {
                grid-column: span 1;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

        /* 焦点样式 */
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>周末城市微旅行规划器</h1>
        <p class="subtitle">逃离日常，用 48 小时探索身边的风景。轻松、简单、即刻出发。</p>
        <div class="date-badge" id="currentDate">加载中...</div>
    </header>

    <!-- 预算设置区域 -->
    <section class="card">
        <div class="card-header">
            <div class="card-title">💰 预算设置</div>
        </div>
        <div class="form-group">
            <label for="budgetInput">人均总预算 (元)</label>
            <input type="number" id="budgetInput" value="1000" min="0" step="10">
        </div>
        <div class="budget-summary">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="budgetBar"></div>
            </div>
            <div class="budget-text">
                <span>已规划: <strong id="spentAmount">0</strong> 元</span>
                <span>剩余: <strong id="remainingAmount">1000</strong> 元</span>
            </div>
        </div>
    </section>

    <!-- 行程规划区域 -->
    <section class="card">
        <div class="card-header">
            <div class="card-title">🗺️ 周末行程</div>
        </div>
        <ul class="itinerary-list" id="itineraryList">
            <!-- 行程卡片将通过 JS 渲染 -->
        </ul>

        <div class="add-form">
            <input type="text" id="newTime" placeholder="时间 (如: 周六 10:00)">
            <input type="text" id="newCost" placeholder="费用 (元)">
            <input type="text" id="newLocation" placeholder="地点" style="grid-column: span 2;">
            <input type="text" id="newActivity" placeholder="活动内容" style="grid-column: span 2;">
            <button class="btn btn-primary" onclick="addItinerary()">添加行程</button>
        </div>
    </section>

    <!-- 行李清单区域 -->
    <section class="card">
        <div class="card-header">
            <div class="card-title">🎒 行李清单</div>
        </div>
        <ul class="packing-list" id="packingList">
            <!-- 行李项将通过 JS 渲染 -->
        </ul>
    </section>
</div>

<script>
    // 初始化数据
    const state = {
        budget: 1000,
        itinerary: [
            {
                id: 1,
                time: "周六 09:00",
                location: "城市植物园",
                activity: "漫步花海，呼吸新鲜空气，拍摄春日特写",
                cost: 0,
                completed: false
            },
            {
                id: 2,
                time: "周六 13:00",
                location: "老城区创意园",
                activity: "探访独立书店与复古咖啡馆，体验慢生活",
                cost: 80,
                completed: false
            },
            {
                id: 3,
                time: "周六 18:30",
                location: "江边景观餐厅",
                activity: "享用精致晚餐，欣赏城市夜景",
                cost: 350,
                completed: false
            },
            {
                id: 4,
                time: "周日 10:00",
                location: "市立美术馆",
                activity: "参观当代艺术展，感受视觉冲击",
                cost: 60,
                completed: false
            },
            {
                id: 5,
                time: "周日 15:00",
                location: "社区手作工坊",
                activity: "体验陶艺制作或香薰蜡烛DIY",
                cost: 200,
                completed: false
            }
        ],
        packing: [
            { id: 1, name: "相机/手机", checked: false },
            { id: 2, name: "充电器/充电宝", checked: false },
            { id: 3, name: "雨伞/雨衣", checked: false },
            { id: 4, name: "舒适运动鞋", checked: false },
            { id: 5, name: "身份证/学生证", checked: false },
            { id: 6, name: "防晒帽/墨镜", checked: false }
        ]
    };

    // 设置日期
    function setDate() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const day = now.getDate();
        const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const dayName = days[now.getDay()];
        
        // 计算最近的一个周末
        let weekendStart = new Date(now);
        if (now.getDay() === 0) { // 周日
            weekendStart.setDate(now.getDate() + 1);
        } else if (now.getDay() === 6) { // 周六
            weekendStart.setDate(now.getDate() + 2);
        } else {
            // 计算距离下一个周六的天数
            const daysUntilSaturday = 6 - now.getDay();
            weekendStart.setDate(now.getDate() + daysUntilSaturday);
        }
        
        const end = new Date(weekendStart);
        end.setDate(weekendStart.getDate() + 1);

        const formatDate = (d) => `${d.getMonth() + 1}月${d.getDate()}日`;
        
        document.getElementById('currentDate').textContent = 
            `${year}年 ${formatDate(weekendStart)} (六) - ${formatDate(end)} (日)`;
    }

    // 计算总花费
    function calculateSpent() {
        return state.itinerary.reduce((sum, item) => sum + (parseFloat(item.cost) || 0), 0);
    }

    // 更新预算显示
    function updateBudgetUI() {
        const spent = calculateSpent();
        const remaining = state.budget - spent;
        const percentage = Math.min((spent / state.budget) * 100, 100);
        
        document.getElementById('spentAmount').textContent = spent;
        document.getElementById('remainingAmount').textContent = remaining;
        
        const bar = document.getElementById('budgetBar');
        bar.style.width = `${percentage}%`;
        
        // 颜色逻辑
        if (remaining < 0) {
            bar.style.backgroundColor = 'var(--danger-color)';
            document.getElementById('remainingAmount').classList.add('over-budget');
        } else if (percentage > 80) {
            bar.style.backgroundColor = '#f1c40f'; // 警告色
            document.getElementById('remainingAmount').classList.remove('over-budget');
        } else {
            bar.style.backgroundColor = 'var(--success-color)';
            document.getElementById('remainingAmount').classList.remove('over-budget');
        }
    }

    // 渲染行程列表
    function renderItinerary() {
        const list = document.getElementById('itineraryList');
        list.innerHTML = '';

        state.itinerary.forEach(item => {
            const li = document.createElement('li');
            li.className = `itinerary-item ${item.completed ? 'completed' : ''}`;
            li.innerHTML = `
                <input type="checkbox" class="item-checkbox" 
                    ${item.completed ? 'checked' : ''} 
                    onchange="toggleItinerary(${item.id})"
                    aria-label="标记 ${item.activity} 为已完成">
                <div class="item-content">
                    <div class="item-time">${item.time}</div>
                    <h3 class="item-title">${item.activity}</h3>
                    <p class="item-desc">📍 ${item.location}</p>
                    <div class="item-cost">💵 费用: ¥${item.cost}</div>
                </div>
                <button class="delete-btn" onclick="deleteItinerary(${item.id})" aria-label="删除行程">
                    &times;
                </button>
            `;
            list.appendChild(li);
        });
        updateBudgetUI();
    }

    // 渲染行李清单
    function renderPacking() {
        const list = document.getElementById('packingList');
        list.innerHTML = '';

        state.packing.forEach(item => {
            const li = document.createElement('li');
            li.className = `packing-item ${item.checked ? 'checked' : ''}`;
            li.innerHTML = `
                <input type="checkbox" 
                    ${item.checked ? 'checked' : ''} 
                    onchange="togglePacking(${item.id})">
                <span>${item.name}</span>
            `;
            // 点击整个区域也能切换
            li.addEventListener('click', (e) => {
                if (e.target.tagName !== 'INPUT') {
                    togglePacking(item.id);
                }
            });
            list.appendChild(li);
        });
    }

    // 交互逻辑
    function toggleItinerary(id) {
        const item = state.itinerary.find(i => i.id === id);
        if (item) {
            item.completed = !item.completed;
            renderItinerary();
        }
    }

    function deleteItinerary(id) {
        if(confirm('确定要删除这个行程吗？')) {
            state.itinerary = state.itinerary.filter(i => i.id !== id);
            renderItinerary();
        }
    }

    function addItinerary() {
        const time = document.getElementById('newTime').value;
        const location = document.getElementById('newLocation').value;
        const activity = document.getElementById('newActivity').value;
        const cost = document.getElementById('newCost').value;

        if (!activity || !location) {
            alert('请填写活动内容和地点');
            return;
        }

        const newItem = {
            id: Date.now(),
            time: time || '待定',
            location: location,
            activity: activity,
            cost: parseFloat(cost) || 0,
            completed: false
        };

        state.itinerary.push(newItem);
        
        // 清空输入框
        document.getElementById('newTime').value = '';
        document.getElementById('newLocation').value = '';
        document.getElementById('newActivity').value = '';
        document.getElementById('newCost').value = '';
        
        renderItinerary();
    }

    function togglePacking(id) {
        const item = state.packing.find(i => i.id === id);
        if (item) {
            item.checked = !item.checked;
            renderPacking();
        }
    }

    // 预算输入监听
    document.getElementById('budgetInput').addEventListener('input', function(e) {
        state.budget = parseFloat(e.target.value) || 0;
        updateBudgetUI();
    });

    // 初始化
    window.onload = function() {
        setDate();
        renderItinerary();
        renderPacking();
    };

</script>

</body>
</html>

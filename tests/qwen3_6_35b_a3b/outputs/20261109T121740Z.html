<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周末城市微旅行规划器</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-secondary: #666666;
            --border-color: #e1e4e8;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        /* 布局容器 */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 头部样式 */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .date-badge {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 4px rgba(74, 144, 226, 0.3);
        }

        /* 卡片通用样式 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* 预算部分 */
        .budget-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="number"], input[type="text"] {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .budget-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .progress-bar-bg {
            height: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--success-color);
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .progress-bar-fill.warning {
            background-color: #f1c40f;
        }

        .progress-bar-fill.danger {
            background-color: var(--danger-color);
        }

        /* 行程列表 */
        .trip-list {
            list-style: none;
        }

        .trip-item {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.2s;
            background-color: #fff;
        }

        .trip-item.completed {
            background-color: #f8f9fa;
            opacity: 0.7;
        }

        .trip-item.completed .trip-content h3 {
            text-decoration: line-through;
            color: #999;
        }

        .trip-checkbox {
            margin-top: 4px;
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--success-color);
        }

        .trip-content {
            flex: 1;
        }

        .trip-content h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .trip-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            gap: 15px;
            margin-bottom: 5px;
        }

        .trip-desc {
            font-size: 0.95rem;
            color: #555;
        }

        .trip-cost {
            font-weight: bold;
            color: var(--primary-color);
            margin-left: auto;
            padding-left: 15px;
            white-space: nowrap;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 10px;
            padding: 0 5px;
        }

        .btn-delete:hover {
            color: var(--danger-color);
        }

        .add-trip-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background-color: #f0f7ff;
        }

        /* 行李清单 */
        .packing-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .packing-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }

        .packing-item:hover {
            background-color: #e9ecef;
        }

        .packing-item input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
        }

        .packing-item.checked {
            text-decoration: line-through;
            color: #999;
            background-color: #f0f0f0;
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .trip-item {
                flex-direction: column;
            }
            .trip-cost {
                margin-left: 35px;
                margin-top: 10px;
            }
            .add-trip-form {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }

        /* 焦点样式 */
        button:focus-visible, input:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>周末城市微旅行规划器</h1>
        <p class="subtitle">逃离日常，用 48 小时探索身边的风景。轻松、预算可控、说走就走。</p>
        <div class="date-badge" id="currentDate">加载中...</div>
    </header>

    <!-- 预算控制区 -->
    <section class="card">
        <div class="card-header">
            <span class="card-title">💰 预算规划</span>
        </div>
        <div class="budget-input-group">
            <label for="budgetInput" style="display:none">设置总预算</label>
            <input type="number" id="budgetInput" placeholder="输入人均总预算 (元)" value="1000">
        </div>
        <div class="budget-stats">
            <span>已花费: <strong id="spentAmount">0</strong> 元</span>
            <span>剩余: <strong id="remainingAmount">1000</strong> 元</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="budgetProgress"></div>
        </div>
    </section>

    <!-- 行程规划区 -->
    <section class="card">
        <div class="card-header">
            <span class="card-title">🗺️ 周末行程</span>
            <button class="btn btn-outline" onclick="resetTrips()">重置默认行程</button>
        </div>
        <ul class="trip-list" id="tripList">
            <!-- 行程卡片将通过 JS 渲染 -->
        </ul>
        
        <div style="margin-top: 20px; border-top: 1px dashed #ddd; padding-top: 15px;">
            <h4 style="margin-bottom: 10px; color: var(--text-secondary);">添加新行程</h4>
            <form class="add-trip-form" id="addTripForm">
                <input type="text" id="newTime" placeholder="时间 (如: 周六 10:00)" style="flex: 1;" required>
                <input type="text" id="newPlace" placeholder="地点" style="flex: 2;" required>
                <input type="number" id="newCost" placeholder="费用 (元)" style="flex: 1;" min="0" required>
                <button type="submit" class="btn btn-primary">添加行程</button>
            </form>
        </div>
    </section>

    <!-- 行李清单区 -->
    <section class="card">
        <div class="card-header">
            <span class="card-title">🎒 行李清单</span>
            <span style="font-size: 0.9rem; color: var(--text-secondary);" id="packingStatus">准备中...</span>
        </div>
        <div class="packing-list" id="packingList">
            <!-- 行李项将通过 JS 渲染 -->
        </div>
    </section>
</div>

<script>
    // --- 数据与状态 ---
    
    // 获取本周末日期
    function getWeekendDate() {
        const now = new Date();
        const day = now.getDay();
        let nextSaturday = now.getDate() + (6 - day);
        let nextSunday = now.getDate() + (7 - day);
        
        // 如果今天是周日，简单处理为下周（或者保持本周，这里简化逻辑）
        // 为了演示效果，我们直接显示“本周末”
        const options = { month: 'long', day: 'numeric' };
        return `本周末: ${now.toLocaleDateString('zh-CN', options)}`;
    }

    // 初始行程数据
    const defaultTrips = [
        { id: 1, time: '周六 09:00', place: '城市植物园', desc: '漫步林荫道，呼吸新鲜空气，拍摄秋日/春日景色。', cost: 0, completed: false },
        { id: 2, time: '周六 12:30', place: '老街美食街', desc: '品尝当地特色小吃：臭豆腐、糖油粑粑、奶茶。', cost: 150, completed: false },
        { id: 3, time: '周六 15:00', place: '独立书店 & 咖啡馆', desc: '挑选一本好书，点一杯手冲，享受慵懒午后。', cost: 60, completed: false },
        { id: 4, time: '周六 19:00', place: '江景餐厅', desc: '晚餐享用精致料理，欣赏城市夜景。', cost: 300, completed: false },
        { id: 5, time: '周日 10:00', place: '创意艺术园区', desc: '参观画廊，逛逛手作市集，购买伴手礼。', cost: 200, completed: false },
        { id: 6, time: '周日 16:00', place: '返程', desc: '乘坐高铁/驾车回家，整理照片。', cost: 100, completed: false }
    ];

    // 初始行李数据
    const defaultPacking = [
        { id: 1, name: '相机/手机', checked: false },
        { id: 2, name: '充电器/充电宝', checked: false },
        { id: 3, name: '雨伞', checked: false },
        { id: 4, name: '舒适的鞋子', checked: false },
        { id: 5, name: '身份证/学生证', checked: false },
        { id: 6, name: '防晒霜', checked: false },
        { id: 7, name: '换洗衣物', checked: false },
        { id: 8, name: '个人洗漱用品', checked: false }
    ];

    // 状态变量
    let trips = JSON.parse(JSON.stringify(defaultTrips));
    let packing = JSON.parse(JSON.stringify(defaultPacking));
    let totalBudget = 1000;

    // --- DOM 元素 ---
    const budgetInput = document.getElementById('budgetInput');
    const spentAmountEl = document.getElementById('spentAmount');
    const remainingAmountEl = document.getElementById('remainingAmount');
    const budgetProgress = document.getElementById('budgetProgress');
    const tripListEl = document.getElementById('tripList');
    const addTripForm = document.getElementById('addTripForm');
    const packingListEl = document.getElementById('packingList');
    const packingStatusEl = document.getElementById('packingStatus');
    const currentDateEl = document.getElementById('currentDate');

    // --- 初始化 ---
    function init() {
        currentDateEl.textContent = getWeekendDate();
        renderTrips();
        renderPacking();
        updateBudgetUI();
    }

    // --- 预算逻辑 ---
    function calculateSpent() {
        return trips.reduce((sum, trip) => sum + (trip.cost || 0), 0);
    }

    function updateBudgetUI() {
        const spent = calculateSpent();
        const budget = parseFloat(budgetInput.value) || 0;
        const remaining = budget - spent;
        
        spentAmountEl.textContent = spent;
        remainingAmountEl.textContent = remaining;

        // 进度条逻辑
        let percentage = 0;
        if (budget > 0) {
            percentage = (spent / budget) * 100;
        }
        
        // 限制最大宽度为100%
        const displayPercentage = Math.min(percentage, 100);
        budgetProgress.style.width = `${displayPercentage}%`;

        // 颜色变化
        budgetProgress.className = 'progress-bar-fill';
        if (percentage > 100) {
            budgetProgress.classList.add('danger');
            remainingAmountEl.style.color = 'var(--danger-color)';
        } else if (percentage > 80) {
            budgetProgress.classList.add('warning');
            remainingAmountEl.style.color = '#f39c12';
        } else {
            remainingAmountEl.style.color = 'var(--text-main)';
        }
    }

    budgetInput.addEventListener('input', updateBudgetUI);

    // --- 行程逻辑 ---
    function renderTrips() {
        tripListEl.innerHTML = '';
        trips.forEach(trip => {
            const li = document.createElement('li');
            li.className = `trip-item ${trip.completed ? 'completed' : ''}`;
            li.innerHTML = `
                <input type="checkbox" class="trip-checkbox" 
                    ${trip.completed ? 'checked' : ''} 
                    onchange="toggleTrip(${trip.id})" 
                    aria-label="标记 ${trip.place} 完成">
                <div class="trip-content">
                    <h3>${trip.place}</h3>
                    <div class="trip-meta">
                        <span>🕒 ${trip.time}</span>
                    </div>
                    <div class="trip-desc">${trip.desc}</div>
                </div>
                <div class="trip-cost">¥${trip.cost}</div>
                <button class="btn-delete" onclick="deleteTrip(${trip.id})" aria-label="删除行程" title="删除">✕</button>
            `;
            tripListEl.appendChild(li);
        });
        updateBudgetUI();
    }

    window.toggleTrip = function(id) {
        const trip = trips.find(t => t.id === id);
        if (trip) {
            trip.completed = !trip.completed;
            renderTrips();
        }
    };

    window.deleteTrip = function(id) {
        if(confirm('确定要删除这个行程吗？')) {
            trips = trips.filter(t => t.id !== id);
            renderTrips();
        }
    };

    window.resetTrips = function() {
        if(confirm('确定要重置为默认行程吗？当前修改将丢失。')) {
            trips = JSON.parse(JSON.stringify(defaultTrips));
            renderTrips();
        }
    };

    addTripForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const time = document.getElementById('newTime').value;
        const place = document.getElementById('newPlace').value;
        const cost = parseFloat(document.getElementById('newCost').value);

        if (time && place && !isNaN(cost)) {
            const newTrip = {
                id: Date.now(), // 简单ID生成
                time: time,
                place: place,
                desc: '自定义行程',
                cost: cost,
                completed: false
            };
            trips.push(newTrip);
            renderTrips();
            addTripForm.reset();
        }
    });

    // --- 行李清单逻辑 ---
    function renderPacking() {
        packingListEl.innerHTML = '';
        let checkedCount = 0;
        
        packing.forEach(item => {
            if (item.checked) checkedCount++;
            
            const label = document.createElement('label');
            label.className = `packing-item ${item.checked ? 'checked' : ''}`;
            label.innerHTML = `
                <input type="checkbox" onchange="togglePacking(${item.id})">
                <span>${item.name}</span>
            `;
            // 让点击整个标签也能触发checkbox
            label.addEventListener('click', function(e) {
                if (e.target.tagName !== 'INPUT') {
                    const checkbox = this.querySelector('input');
                    checkbox.checked = !checkbox.checked;
                    togglePacking(item.id);
                }
            });
            
            packingListEl.appendChild(label);
        });

        // 更新状态文字
        if (checkedCount === packing.length) {
            packingStatusEl.textContent = '✅ 准备就绪！';
            packingStatusEl.style.color = 'var(--success-color)';
        } else {
            packingStatusEl.textContent = `已准备 ${checkedCount}/${packing.length}`;
            packingStatusEl.style.color = 'var(--text-secondary)';
        }
    }

    window.togglePacking = function(id) {
        const item = packing.find(p => p.id === id);
        if (item) {
            item.checked = !item.checked;
            renderPacking();
        }
    };

    // 启动应用
    init();

</script>

</body>
</html>

[project]
name = "music-i2v-benchmark"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "PyYAML>=6,<7", "psutil>=5.9,<8", "Pillow>=10,<13"]

[project.scripts]
i2vbench = "i2vbench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["i2vbench.py"]

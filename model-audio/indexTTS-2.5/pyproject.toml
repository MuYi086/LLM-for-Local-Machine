[project]
name = "indextts25-service"
version = "0.1.0"
description = "LLM Local Backend IndexTTS-2.5 HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "accelerate==1.8.1",
    "cn2an==0.5.22",
    "cython==3.0.7",
    "descript-audiotools==0.7.2",
    "einops==0.8.1",
    "fastapi==0.136.3",
    "ffmpeg-python==0.2.0",
    "fugashi[unidic-lite]>=1.2.0",
    "g2p-en==2.1.0",
    "jieba==0.42.1",
    "json5==0.10.0",
    "keras==2.9.0",
    "librosa==0.10.2.post1",
    "matplotlib==3.10.0",
    "modelscope==1.27.0",
    "munch==4.0.0",
    "numba==0.63.0",
    "numpy==2.2.6",
    "omegaconf>=2.3.0",
    "opencv-python==4.9.0.80",
    "pandas==2.3.2",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "requests>=2.28",
    "safetensors==0.5.2",
    "sentencepiece>=0.2.1",
    "starlette==1.3.1",
    "tensorboard==2.20.0",
    "textstat>=0.7.10",
    "tokenizers==0.21.0",
    "torch==2.8.0+cu128",
    "torchaudio==2.8.0+cu128",
    "transformers==4.52.1",
    "uvicorn==0.49.0",
    "openai-whisper>=20231117",
    "WeTextProcessing; sys_platform == 'linux'",
    "wetext>=0.0.9; sys_platform != 'linux'",
    "llm-local-runtime",
]

[tool.uv]
package = false
index-strategy = "first-index"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["ruff>=0.15.9"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu128/"
format = "flat"
explicit = true

[tool.uv.sources]
llm-local-runtime = { path = "../../llm_local_runtime", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

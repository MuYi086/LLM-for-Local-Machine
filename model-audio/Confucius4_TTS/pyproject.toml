[project]
name = "confucius4-tts-service"
version = "0.1.0"
description = "LLM Local Backend Confucius4-TTS zero-shot voice cloning HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.136.3",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    # Aliyun CUDA 13.0 镜像中的可用配对，与仓库其他 CUDA 13.0 服务保持一致。
    "torch==2.12.0",
    "torchaudio==2.11.0",
    # TorchAudio 2.11 的 load/save 已通过 TorchCodec 处理音频文件。
    "torchcodec==0.16.0",
    "transformers==4.52.4",
    "huggingface-hub==0.36.2",
    "safetensors==0.7.0",
    "numpy==1.26.4",
    "pyyaml==6.0.3",
    "librosa==0.10.2.post1",
    "scipy==1.15.3",
    "soundfile==0.13.1",
    "sentencepiece==0.2.1",
    "ema-pytorch==0.7.9",
    "packaging==26.0",
    "filelock==3.25.0",
    "matplotlib==3.10.8",
    "fsspec==2026.2.0",
    "inflect==7.5.0",
    "regex==2026.3.32",
    "jaconv==0.5.0",
    "pykakasi==2.3.0",
    "protobuf==3.19.6",
    "llm-local-runtime",
    "llm-local-inference-gateway",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu130/"
format = "flat"
explicit = true

[tool.uv.sources]
llm-local-runtime = { path = "../../llm_local_runtime", editable = true }
llm-local-inference-gateway = { path = "../../inference_gateway", editable = true }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

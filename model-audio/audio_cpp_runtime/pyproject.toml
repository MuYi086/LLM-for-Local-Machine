[project]
name = "audio-cpp-runtime"
version = "0.1.0"
description = "共享 LocalAI/audio.cpp 模型 HTTP 运行环境"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.141.1",
    "llm-local-inference-gateway",
    "llm-local-runtime",
    "python-multipart==0.0.32",
    "uvicorn==0.52.1",
]

[tool.uv.sources]
llm-local-inference-gateway = { path = "../../inference_gateway", editable = true }
llm-local-runtime = { path = "../../llm_local_runtime", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

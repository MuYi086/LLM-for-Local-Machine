[project]
name = "tiger-dnr-service"
version = "0.1.0"
description = "LLM Local Backend TIGER-DnR three-stem separation HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.141.1",
    "huggingface-hub==0.36.2",
    "numpy==2.0.2",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "safetensors>=0.4",
    "starlette==1.6.0",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "llm-local-runtime",
    "llm-local-inference-gateway",
    "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.uv]
package = false

[tool.uv.sources]
llm-local-inference-gateway = { path = "../../inference_gateway", editable = true }
llm-local-runtime = { path = "../../llm_local_runtime", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[project]
name = "msst-mega53-service"
version = "0.1.0"
description = "MSST Mega 53 targeted music separation HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.136.3",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "PyYAML",
    "librosa",
    "matplotlib",
    "ml-collections",
    "numpy>=2.0.0",
    "omegaconf",
    "pandas",
    "requests",
    "soundfile",
    "torch==2.12.0",
    "torchaudio==2.11.0",
    "torchcodec==0.16.0",
    "tqdm",
    "beartype",
    "einops",
    "packaging",
    "rotary-embedding-torch",
    "PoPE-pytorch",
    "llm-local-runtime",
]

[dependency-groups]
dev = ["ruff>=0.15.9"]

[tool.uv]
package = false
index-strategy = "first-index"
link-mode = "hardlink"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu130/"
format = "flat"
explicit = true

[tool.uv.sources]
llm-local-runtime = { path = "../../llm_local_runtime", editable = true }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

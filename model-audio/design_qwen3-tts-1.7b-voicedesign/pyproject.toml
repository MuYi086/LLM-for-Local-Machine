[project]
name = "qwen3-tts-voicedesign-service"
version = "0.1.0"
description = "Qwen3-TTS VoiceDesign audio.cpp HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.141.1",
    "llm-local-runtime",
    "llm-local-inference-gateway",
    "uvicorn==0.52.1",
]

[dependency-groups]
dev = ["ruff>=0.15.9"]

[tool.uv]
package = false

[tool.uv.sources]
llm-local-inference-gateway = { path = "../../inference_gateway", editable = true }
llm-local-runtime = { path = "../../llm_local_runtime", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

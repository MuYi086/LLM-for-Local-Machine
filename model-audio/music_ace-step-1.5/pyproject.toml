[project]
name = "ace-step-1-5-service"
version = "0.1.0"
description = "LLM Local Backend ACE-Step 1.5 BGM HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.136.3",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "accelerate>=1.10.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git@59c47446f2f9e9e8e45f23d2e2dde2bb475d97b7",
    "numpy==2.2.6",
    "safetensors==0.8.0",
    "soundfile==0.14.0",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "transformers==5.15.0",
    "llm-local-runtime",
    "llm-local-inference-gateway",
]

[dependency-groups]
dev = [
    "httpx2>=0.28",
    "pytest==9.1.1",
    "ruff>=0.15.9",
]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "aliyun-pytorch-cu126"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu126/"
format = "flat"
explicit = true

[tool.uv.sources]
llm-local-runtime = { path = "../../llm_local_runtime", editable = true }
llm-local-inference-gateway = { path = "../../inference_gateway", editable = true }
torch = { index = "aliyun-pytorch-cu126" }
torchaudio = { index = "aliyun-pytorch-cu126" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

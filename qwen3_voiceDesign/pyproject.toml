[project]
name = "qwen3-voicedesign-service"
version = "0.1.0"
description = "Unitale Qwen3-TTS VoiceDesign HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.136.3",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "qwen-tts==0.1.1",
    "torch==2.12.0",
    "torchaudio==2.11.0",
    "numpy==2.4.6",
    "soundfile==0.14.0",
    "unitale-inference-gateway",
    "unitale-runtime",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu130/"
format = "flat"
explicit = true

[tool.uv.sources]
unitale-runtime = { path = "../unitale_runtime", editable = true }
unitale-inference-gateway = { path = "../inference_gateway", editable = true }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

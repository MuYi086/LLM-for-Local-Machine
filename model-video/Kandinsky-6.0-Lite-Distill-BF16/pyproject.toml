[project]
name = "kandinsky6-lite-distill-service"
version = "0.1.0"
description = "LLM Local Backend Kandinsky 6 Lite distilled image-to-video service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "diffusers==0.42.0",
    "transformers>=5.0.0,<6",
    "accelerate>=1.8.1",
    "safetensors>=0.6.0",
    "numpy==1.26.4",
    "pillow>=11.1.0",
    "av>=14.2.0",
    "tqdm>=4.67.1",
    "llm-local-runtime",
]

[dependency-groups]
dev = ["ruff>=0.15.9"]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
llm-local-runtime = { path = "../../llm_local_runtime", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

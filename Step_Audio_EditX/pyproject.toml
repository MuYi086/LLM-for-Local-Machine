[project]
name = "step-audio-editx-service"
version = "0.1.0"
description = "Unitale Step-Audio-EditX HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
    "triton==3.5.1",
    "compressed-tensors==0.13.0",
    "transformers==4.57.3",
    "numpy==2.2.6",
    "scipy==1.18.0",
    "soundfile==0.14.0",
    "librosa==0.11.0",
    "ffmpeg-python==0.2.0",
    "hdbscan==0.8.41",
    "rotary-embedding-torch==0.8.9",
    "sox==1.5.0",
    "torchcodec==0.9.1",
    "onnxruntime-gpu==1.28.0",
    "openai-whisper==20250625",
    "funasr==1.4.0",
    "hyperpyyaml==1.2.3",
    "einops==0.8.2",
    "sentencepiece==0.2.2",
    "huggingface-hub==0.36.2",
    "modelscope==1.39.0",
    "safetensors==0.8.0",
    "tokenizers==0.22.2",
    "vllm",
    "unitale-runtime",
    "unitale-inference-gateway",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.uv]
package = false
# 普通依赖走官方 PyPI；Torch CUDA wheel 通过下面的显式来源单独解析。
# flat index 可避免 uv 访问官方 PyTorch 索引时的额外延迟。
index-strategy = "first-index"
concurrent-downloads = 20
concurrent-installs = 8

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128-aliyun"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu128/"
format = "flat"
explicit = true

[tool.uv.sources]
unitale-inference-gateway = { path = "../inference_gateway", editable = true }
unitale-runtime = { path = "../unitale_runtime", editable = true }
torch = { index = "pytorch-cu128-aliyun" }
torchaudio = { index = "pytorch-cu128-aliyun" }
torchvision = { index = "pytorch-cu128-aliyun" }
vllm = { url = "https://wheels.vllm.ai/c826c72a9633454679871fcb81fbc31fe03fb150/vllm-0.14.0rc2.dev125%2Bgc826c72a9-cp38-abi3-manylinux_2_31_x86_64.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

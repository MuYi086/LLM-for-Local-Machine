[project]
name = "soulx-flashhead-service"
version = "0.1.0"
description = "Unitale SoulX-FlashHead audio-driven portrait video HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    # 使用官方推理验证过的 Torch/CUDA 配对，避免 attention 扩展 ABI 不匹配。
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",
    "diffusers==0.36.0",
    "transformers==4.57.3",
    "accelerate>=1.8.1",
    "huggingface-hub<1",
    "safetensors>=0.4.5",
    "numpy==1.26.4",
    "pyyaml>=6.0.2",
    "librosa>=0.10.2",
    "soundfile>=0.13.1",
    "scipy>=1.15.3",
    "pillow>=11.1.0",
    "einops>=0.8.1",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "easydict>=1.13",
    "ftfy>=6.3.1",
    "scikit-image>=0.25.2",
    "loguru>=0.7.3",
    "xfuser==0.4.3",
    "pyloudnorm>=0.1.1",
    # 上游 facecrop 使用 mediapipe.solutions；0.10.21 支持 Python 3.12，
    # 与 NumPy 1.x 兼容的 OpenCV 配对避免安装 4.12 引入 NumPy 2。
    "mediapipe==0.10.21",
    "opencv-contrib-python==4.11.0.86",
    "unitale-runtime",
]

[dependency-groups]
dev = ["ruff>=0.15.9"]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
unitale-runtime = { path = "../unitale_runtime", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

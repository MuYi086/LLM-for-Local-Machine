[project]
name = "stable-audio-3-medium-service"
version = "0.1.0"
description = "Unitale Stable Audio 3 Medium HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.136.3",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "einops==0.8.2",
    "einops-exts==0.0.4",
    "huggingface-hub==1.27.0",
    "numpy==2.2.6",
    "packaging==26.2",
    "safetensors==0.8.0",
    "soundfile==0.14.0",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "tqdm==4.70.0",
    "transformers==5.15.0",
    "unitale-runtime",
    "unitale-inference-gateway",
]

[dependency-groups]
dev = [
    "httpx2>=0.28",
    "pytest==9.1.1",
    "ruff>=0.15.9",
]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "aliyun-pytorch-cu126"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu126/"
format = "flat"
explicit = true

[tool.uv.sources]
unitale-runtime = { path = "../unitale_runtime", editable = true }
unitale-inference-gateway = { path = "../inference_gateway", editable = true }
torch = { index = "aliyun-pytorch-cu126" }
torchaudio = { index = "aliyun-pytorch-cu126" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# These imports intentionally follow temporary-directory environment setup.
"tests/test_migration.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[project]
name = "sheetsage2-service"
version = "0.1.0"
description = "Unitale SheetSage2 music transcription HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.136.3",
    "huggingface-hub==0.36.0",
    "mir-eval==0.8.2",
    "mido==1.3.3",
    "numpy==1.26.4",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "pretty-midi==0.2.10",
    "safetensors==0.5.3",
    "scipy==1.13.1",
    # pretty-midi 0.2.10 运行时仍导入 pkg_resources，需保留提供它的 setuptools。
    "setuptools==80.10.2",
    "starlette==1.3.1",
    "torch==2.8.0+cu128",
    "torchaudio==2.8.0+cu128",
    "transformers==4.45.2",
    "unitale-runtime",
    "uvicorn==0.49.0",
]

[tool.uv]
package = false
index-strategy = "first-index"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = ["ruff>=0.15.9"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu128/"
format = "flat"
explicit = true

[tool.uv.sources]
unitale-runtime = { path = "../unitale_runtime", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

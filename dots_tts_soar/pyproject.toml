[project]
name = "dots-tts-soar-service"
version = "0.1.0"
description = "Unitale dots.tts-soar voice cloning HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn==0.52.1",
    "pydantic==2.12.5",
    "python-multipart==0.0.32",
    "dots-tts",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "numpy==2.2.6",
    "soundfile==0.13.1",
    "einops==0.8.2",
    "huggingface-hub==0.36.2",
    "loguru==0.7.3",
    "langcodes[data]==3.5.1",
    "gradio==6.17.3",
    "librosa==0.11.0",
    "PyYAML==6.0.3",
    "safetensors==0.8.0rc0",
    "torchdiffeq==0.2.5",
    "tqdm==4.70.0",
    "lingua-language-detector==2.1.1",
    "WeTextProcessing==1.2.0",
    "pynini==2.1.7",
    "unitale-runtime",
    "unitale-inference-gateway",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.uv]
package = false
index-strategy = "first-index"
concurrent-downloads = 20
concurrent-installs = 8

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128-aliyun"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu128/"
format = "flat"
explicit = true

[tool.uv.sources]
unitale-runtime = { path = "../unitale_runtime", editable = true }
unitale-inference-gateway = { path = "../inference_gateway", editable = true }
dots-tts = { git = "https://github.com/rednote-hilab/dots.tts.git", rev = "4947d364baa5afb2daf1feb00a247b5f23f97878" }
torch = { index = "pytorch-cu128-aliyun" }
torchaudio = { index = "pytorch-cu128-aliyun" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

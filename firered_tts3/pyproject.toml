[project]
name = "firered-tts3-service"
version = "0.1.0"
description = "Unitale FireRedTTS3 voice cloning and voice design service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.50.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
    "transformers==5.6.2",
    "einops==0.8.2",
    "python-dotenv==1.1.1",
    "regex",
    "wetext",
    "fasttext==0.9.3",
    "faster-whisper==1.2.0",
    "unitale-runtime",
    "unitale-inference-gateway",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "tsinghua-pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128-aliyun"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu128/"
format = "flat"
explicit = true

[tool.uv.sources]
unitale-runtime = { path = "../unitale_runtime", editable = true }
unitale-inference-gateway = { path = "../inference_gateway", editable = true }
torch = { index = "pytorch-cu128-aliyun" }
torchaudio = { index = "pytorch-cu128-aliyun" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

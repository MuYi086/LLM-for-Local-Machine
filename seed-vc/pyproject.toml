[project]
name = "seed-vc-service"
version = "0.1.0"
description = "Unitale Seed-VC one-shot voice conversion HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.136.3",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    # 与 Confucius4-TTS 使用相同的 CUDA 13.0 运行环境。
    "torch==2.12.0",
    "torchaudio==2.11.0",
    "torchcodec==0.16.0",
    "transformers==4.46.3",
    "huggingface-hub==0.36.2",
    "numpy==1.26.4",
    "scipy==1.15.3",
    "librosa==0.10.2.post1",
    "soundfile==0.13.1",
    "pyyaml==6.0.3",
    "munch==4.0.0",
    "einops==0.8.0",
    # 官方 length_regulator 在模块导入时使用 dac.nn.quantize。
    "descript-audio-codec==1.0.0",
    "unitale-runtime",
]

[dependency-groups]
dev = ["ruff>=0.15.9"]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu130/"
format = "flat"
explicit = true

[tool.uv.sources]
unitale-runtime = { path = "../unitale_runtime", editable = true }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

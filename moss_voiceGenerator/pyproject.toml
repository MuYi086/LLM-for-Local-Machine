[project]
name = "moss-voicegenerator-service"
version = "0.1.0"
description = "Unitale MOSS VoiceGenerator HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.136.3",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "torch==2.12.0",
    "torchaudio==2.11.0",
    "transformers==5.12.0",
    "accelerate==1.12.0",
    "numpy==2.1.0",
    "soundfile==0.14.0",
    "moss-tts",
    "unitale-runtime",
    "unitale-inference-gateway",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# MOSS-VoiceGenerator requires the locally prepared upstream checkout. Keep it
# editable so deployment can use its preinstalled source without network access.
moss-tts = { path = "/home/muyi086/tts-depency/MOSS-TTS", editable = true }
unitale-runtime = { path = "../unitale_runtime", editable = true }
unitale-inference-gateway = { path = "../inference_gateway", editable = true }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

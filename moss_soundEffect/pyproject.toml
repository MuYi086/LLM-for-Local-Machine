[project]
name = "moss-soundeffect-service"
version = "0.1.0"
description = "Unitale MOSS-SoundEffect v2 HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "starlette==1.3.1",
    "numpy==1.26.4",
    "einops==0.8.2",
    "pillow==12.2.0",
    "tqdm==4.67.3",
    "safetensors==0.7.0",
    "transformers==4.57.1",
    "diffusers==0.37.1",
    "ftfy==6.3.1",
    "regex==2026.4.4",
    "soundfile==0.13.1",
    "imageio==2.37.3",
    "typing-extensions>=4.10",
    "descript-audiotools==0.7.2",
    "torch==2.9.0+cu128",
    "torchaudio==2.9.0+cu128",
    "unitale-runtime",
    "unitale-inference-gateway",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "aliyun-pytorch-cu128"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu128/"
format = "flat"
explicit = true

[tool.uv.sources]
unitale-inference-gateway = { path = "../inference_gateway", editable = true }
unitale-runtime = { path = "../unitale_runtime", editable = true }
torch = { index = "aliyun-pytorch-cu128" }
torchaudio = { index = "aliyun-pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
